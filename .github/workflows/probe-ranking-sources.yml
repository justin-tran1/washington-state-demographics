name: Temporary probe - ranking sources
on:
  push:
    branches: [claude/washington-mapping-app-b4sipc]
    paths: ['scripts/probe/ranking-sources.sh', '.github/workflows/probe-ranking-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/probe/ranking-sources.sh
