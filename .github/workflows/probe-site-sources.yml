name: Probe site sources (temporary)

# TEMPORARY: runs scripts/probe/site-sources.mjs from GitHub Actions, which can
# reach the GIS services the development sandbox cannot. Removed before merge.
on:
  push:
    branches: [claude/washington-mapping-app-b4sipc]
    paths:
      - 'scripts/probe/**'
      - '.github/workflows/probe-site-sources.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Probe
        run: node scripts/probe/site-sources.mjs
